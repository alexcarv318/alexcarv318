ns)</tspan></text></g><g class="a r2v2" style="animation-duration:140.0s"><text y="191" class="mono"><tspan x="28" class="k">building</tspan><tspan x="145.0" class="w">tools that read the boring documents so humans don't have to</tspan></text></g><g class="a r2v3" style="animation-duration:140.0s"><text y="191" class="mono"><tspan x="28" class="k">building</tspan><tspan x="145.0" class="w">sophisticated memory for AI agents (they forget everything I tell them)</tspan></text></g><g class="a r2v4" style="animation-duration:140.0s"><text y="191" class="mono"><tspan x="28" class="k">building</tspan><tspan x="145.0" class="w">desktop apps in Tauri (400 MB for a notes app is a choice)</tspan></text></g><g class="a r2v5" style="animation-duration:140.0s"><text y="191" class="mono"><tspan x="28" class="k">building</tspan><tspan x="145.0" class="w">apps on Cloudflare Workers, because servers are a lifestyle choice</tspan></text></g><g class="a r2v6" style="animation-duration:140.0s"><text y="191" class="mono"><tspan x="28" class="k">building</tspan><tspan x="145.0" class="w">web apps that load fast and look like someone cared</tspan></text></g><g class="a r3v0" style="animation-duration:140.0s"><text y="216" class="mono"><tspan x="28" class="k">obsessed</tspan><tspan x="145.0" class="w">happy clients (the paying kind)</tspan></text></g><g class="a r3v1" style="animation-duration:140.0s"><text y="216" class="mono"><tspan x="28" class="k">obsessed</tspan><tspan x="145.0" class="w">the moment a client says "perfect, ship it"</tspan></text></g><g class="a r3v2" style="animation-duration:140.0s"><text y="216" class="mono"><tspan x="28" class="k">obsessed</tspan><tspan x="145.0" class="w">invoices that get paid for work that gets praised</tspan></text></g><g class="a r3v3" style="animation-duration:140.0s"><text y="216" class="mono"><tspan x="28" class="k">obsessed</tspan><tspan x="145.0" class="w">happy clients (the paying kind)</tspan></text></g><g class="a r3v4" style="animatio